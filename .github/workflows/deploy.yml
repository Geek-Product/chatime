name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/geek-product/chatime:main-${{ github.sha }}
            ghcr.io/geek-product/chatime:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-push
    runs-on: [self-hosted, linux, x64]
    environment: prod
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Render .env from secrets
        id: env
        env:
          APP_URL: ${{ secrets.APP_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CHATIME_DATABASE_URL: ${{ secrets.CHATIME_DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          UPLOAD_MAX_MB: ${{ secrets.UPLOAD_MAX_MB }}
          CLIENT_ORIGIN: ${{ secrets.CLIENT_ORIGIN }}
        run: |
          set -euo pipefail

          required=(
            APP_URL
            DATABASE_URL
            CHATIME_DATABASE_URL
            JWT_SECRET
            UPLOAD_MAX_MB
          )

          for v in "${required[@]}"; do
            if [ -z "${!v:-}" ]; then
              echo "::error::Missing required secret: $v"
              exit 1
            fi
          done

          printf '%s\n' \
            "PORT=4001" \
            "CHATIME_PORT=4001" \
            "CLIENT_ORIGIN=$CLIENT_ORIGIN" \
            "APP_URL=$APP_URL" \
            "NODE_ENV=production" \
            "DATABASE_URL=$DATABASE_URL" \
            "CHATIME_DATABASE_URL=$CHATIME_DATABASE_URL" \
            "UPLOAD_DIR=server/uploads" \
            "UPLOAD_MAX_MB=$UPLOAD_MAX_MB" \
            "JWT_SECRET=$JWT_SECRET" \
            "ACCESS_TOKEN_TTL=15m" \
            "REFRESH_TOKEN_TTL_DAYS=30" \
            > .env.rendered

          chmod 600 .env.rendered
          echo "env_file=.env.rendered" >> "$GITHUB_OUTPUT"

      
      - name: Diagnose deployment workspace
        run: |
          set -euo pipefail

          echo "=== Workspace ==="
          pwd
          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"

          echo "=== Root files ==="
          ls -lah

          echo "=== Deploy directory ==="
          ls -lah deploy/

          echo "=== Required files ==="
          for file in \
            docker-compose.yml \
            deploy/deploy.sh \
            .env.rendered
          do
            if [ ! -f "$file" ]; then
              echo "::error::Missing file: $file"
              exit 1
            fi

            echo "OK: $file"
          done

      
      - name: Copy files to target
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: "./docker-compose.yml,./deploy/deploy.sh,./.env.rendered"
          target: /opt/chatime/
          overwrite: true
          debug: true

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          CHATIME_IMAGE: ghcr.io/geek-product/chatime:main-${{ github.sha }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          remote_dir: /opt/chatime
          envs: |
            CHATIME_IMAGE=ghcr.io/geek-product/chatime:main-${{ github.sha }}
          script: |
            set -euo pipefail
            cd /opt/chatime
            cp .env.rendered .env
            chmod 600 .env
            chmod +x /opt/chatime/deploy/deploy.sh
            docker pull "$CHATIME_IMAGE"
            docker compose up -d --no-build --remove-orphans
            for i in $(seq 1 40); do
              if [ "$(docker inspect --format '{{.State.Health.Status}}' chatime-app 2>/dev/null)" = "healthy" ]; then
                echo "chatime-app healthy with $CHATIME_IMAGE"
                docker image prune -f >/dev/null 2>&1 || true
                exit 0
              fi
              sleep 3
            done
            echo "chatime-app did not become healthy" >&2
            docker compose logs --tail 50 app >&2 || true
            exit 1
