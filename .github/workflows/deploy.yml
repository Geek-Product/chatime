
name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/geek-product/chatime:main-${{ github.sha }}
            ghcr.io/geek-product/chatime:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-push
    runs-on: [self-hosted, linux, x64]
    environment: prod
    steps:
      - uses: actions/checkout@v4

      - name: Fetch secrets from Infisical
        shell: bash
        env:
          INFISICAL_TOKEN: ${{ secrets.INFISICAL_TOKEN }}
          INFISICAL_PROJECT_ID: ${{ secrets.INFISICAL_PROJECT_ID }}
          INFISICAL_URL: ${{ secrets.INFISICAL_URL }}
          INFISICAL_ENV: ${{ secrets.INFISICAL_ENV }}
          INFISICAL_PATH: ${{ secrets.INFISICAL_PATH }}
        run: |
          set -euo pipefail
          umask 077

          command -v infisical >/dev/null || {
            echo "::error::Infisical CLI is not installed on runner"
            exit 1
          }

          export INFISICAL_DISABLE_UPDATE_CHECK=true
          test -n "$INFISICAL_URL" || {
            echo "::error::Missing INFISICAL_URL"
            exit 1
          }
          export INFISICAL_DOMAIN="${INFISICAL_URL%/}"

          test -n "$INFISICAL_PROJECT_ID" || {
            echo "::error::Missing INFISICAL_PROJECT_ID"
            exit 1
          }

          infisical export \
            --projectId="$INFISICAL_PROJECT_ID" \
            --env="$INFISICAL_ENV" \
            --path="$INFISICAL_PATH" \
            --format=dotenv-eval \
            --output-file=.env.infisical
          chmod 600 .env.infisical

      - name: Render .env
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          # Infisical dotenv output is shell-compatible; values stay on runner only.
          set -a
          . ./.env.infisical
          set +a

          required=(APP_URL CHATIME_DATABASE_URL JWT_SECRET UPLOAD_MAX_MB CLIENT_ORIGIN)
          for v in "${required[@]}"; do
            if [ -z "${!v:-}" ]; then
              echo "::error::Missing required Infisical secret: $v"
              exit 1
            fi
          done

          if [[ "$APP_URL" != https://* ]]; then
            echo "::warning::APP_URL is not https:// - browsers only allow Web Push on secure origins"
          fi

          # Web Push is optional: forward the keys only when Infisical defines both.
          if [ -n "${VAPID_PUBLIC_KEY:-}" ] && [ -n "${VAPID_PRIVATE_KEY:-}" ]; then
            VAPID_SUBJECT="${VAPID_SUBJECT:-mailto:admin@example.com}"
          else
            VAPID_PUBLIC_KEY=""
            VAPID_PRIVATE_KEY=""
            VAPID_SUBJECT=""
            echo "::warning::VAPID_PUBLIC_KEY/VAPID_PRIVATE_KEY missing from Infisical - Web Push will be disabled"
          fi

          printf '%s\n' \
            "PORT=4001" \
            "CHATIME_PORT=4001" \
            "CLIENT_ORIGIN=$CLIENT_ORIGIN" \
            "APP_URL=$APP_URL" \
            "NODE_ENV=production" \
            "CHATIME_DATABASE_URL=$CHATIME_DATABASE_URL" \
            "UPLOAD_DIR=server/uploads" \
            "UPLOAD_MAX_MB=$UPLOAD_MAX_MB" \
            "JWT_SECRET=$JWT_SECRET" \
            "ACCESS_TOKEN_TTL=15m" \
            "REFRESH_TOKEN_TTL_DAYS=30" \
            "VAPID_PUBLIC_KEY=$VAPID_PUBLIC_KEY" \
            "VAPID_PRIVATE_KEY=$VAPID_PRIVATE_KEY" \
            "VAPID_SUBJECT=$VAPID_SUBJECT" > .env.rendered
          chmod 600 .env.rendered

      - name: Prepare SSH
        shell: bash
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077

          SSH_KEY="${SSH_KEY//$'\r'/}"
          KEY_FILE="$RUNNER_TEMP/chatime-deploy-key"

          printf '%s\n' "$SSH_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"

          if ! ssh-keygen -y -f "$KEY_FILE" >/dev/null 2>&1; then
            echo "::error::Invalid SSH private key."
            exit 1
          fi

      - name: Test SSH connection
        shell: bash
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
        run: |
          set -euo pipefail

          KEY_FILE="$RUNNER_TEMP/chatime-deploy-key"

          ssh_opts=(
            -i "$KEY_FILE"
            -p "$SSH_PORT"
            -o StrictHostKeyChecking=no
            -o UserKnownHostsFile=/dev/null
            -o ConnectTimeout=10
            -o BatchMode=yes
          )

          ssh "${ssh_opts[@]}" "${SSH_USER}@${SSH_HOST}" \
            "whoami && mkdir -p /opt/chatime/deploy"

      - name: Transfer deployment config via SSH
        shell: bash
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
        run: |
          set -euo pipefail
          KEY_FILE="$RUNNER_TEMP/chatime-deploy-key"
          ssh_opts=(-i "$KEY_FILE" -p "$SSH_PORT" \
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=10 -o BatchMode=yes)

          # File stabil → selalu dikirim (robust terhadap penghapusan di remote)
          echo "Sending docker-compose.yml..."
          ssh "${ssh_opts[@]}" "${SSH_USER}@${SSH_HOST}" \
            'mkdir -p /opt/chatime && cat > /opt/chatime/docker-compose.yml' \
            < docker-compose.yml

          echo "Sending deploy/deploy.sh..."
          ssh "${ssh_opts[@]}" "${SSH_USER}@${SSH_HOST}" \
            'mkdir -p /opt/chatime/deploy && cat > /opt/chatime/deploy/deploy.sh && chmod 700 /opt/chatime/deploy/deploy.sh' \
            < deploy/deploy.sh

          # .env.rendered: selalu dikirim (secrets selalu berubah)
          echo "Sending .env.rendered..."
          cat .env.rendered | ssh "${ssh_opts[@]}" "${SSH_USER}@${SSH_HOST}" \
            "cat > /opt/chatime/.env && chmod 600 /opt/chatime/.env"

          echo "Configuration transfer completed."

      - name: Deploy via GHCR image pull over SSH
        shell: bash
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHATIME_IMAGE: ghcr.io/geek-product/chatime:main-${{ github.sha }}
        run: |
          set -euo pipefail
          KEY_FILE="$RUNNER_TEMP/chatime-deploy-key"
          ssh_opts=(-i "$KEY_FILE" -p "$SSH_PORT" \
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=10 -o BatchMode=yes)

          echo "Deploying image: $CHATIME_IMAGE"
          printf '%s' "$GHCR_TOKEN" | ssh "${ssh_opts[@]}" "${SSH_USER}@${SSH_HOST}" \
            "docker login ghcr.io -u '$GHCR_USERNAME' --password-stdin"

          # Eksekusi logika deploy yang sudah terpusat di deploy.sh (sangat singkat)
          ssh "${ssh_opts[@]}" "${SSH_USER}@${SSH_HOST}" \
            "CHATIME_DIR=/opt/chatime /opt/chatime/deploy/deploy.sh '$CHATIME_IMAGE'"

      - name: Cleanup sensitive files
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/chatime-deploy-key" .env.infisical .env.rendered
