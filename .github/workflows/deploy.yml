name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/geek-product/chatime:main-${{ github.sha }}
            ghcr.io/geek-product/chatime:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-push
    runs-on: [self-hosted, linux, x64]
    environment: prod
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Render .env from secrets
        id: env
        env:
          APP_URL: ${{ secrets.APP_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CHATIME_DATABASE_URL: ${{ secrets.CHATIME_DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          UPLOAD_MAX_MB: ${{ secrets.UPLOAD_MAX_MB }}
          CLIENT_ORIGIN: ${{ secrets.CLIENT_ORIGIN }}
        run: |
          set -euo pipefail

          required=(
            APP_URL
            DATABASE_URL
            CHATIME_DATABASE_URL
            JWT_SECRET
            UPLOAD_MAX_MB
          )

          for v in "${required[@]}"; do
            if [ -z "${!v:-}" ]; then
              echo "::error::Missing required secret: $v"
              exit 1
            fi
          done

          printf '%s\n' \
            "PORT=4001" \
            "CHATIME_PORT=4001" \
            "CLIENT_ORIGIN=$CLIENT_ORIGIN" \
            "APP_URL=$APP_URL" \
            "NODE_ENV=production" \
            "DATABASE_URL=$DATABASE_URL" \
            "CHATIME_DATABASE_URL=$CHATIME_DATABASE_URL" \
            "UPLOAD_DIR=server/uploads" \
            "UPLOAD_MAX_MB=$UPLOAD_MAX_MB" \
            "JWT_SECRET=$JWT_SECRET" \
            "ACCESS_TOKEN_TTL=15m" \
            "REFRESH_TOKEN_TTL_DAYS=30" \
            > .env.rendered

          chmod 600 .env.rendered
          echo "env_file=.env.rendered" >> "$GITHUB_OUTPUT"

      
      - name: Test SSH connection
        shell: bash
        run: |
          set -euo pipefail
          SSH_USER="${{ secrets.SSH_USER }}"
          SSH_HOST="${{ secrets.SSH_HOST }}"
          SSH_PORT="${{ secrets.SSH_PORT || 22 }}"
          SSH_KEY="${{ secrets.SSH_PRIVATE_KEY }}"
          TARGET="/opt/chatime"

          # Strip carriage returns (\r) yang sering ada di secret GitHub
          SSH_KEY="${SSH_KEY//$'\r'/}"

          KEY_FILE="/tmp/chatime-deploy-key"
          printf '%s\n' "$SSH_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"

          # Validasi format key sebelum digunakan
          if ! ssh-keygen -y -f "$KEY_FILE" >/dev/null 2>&1; then
            echo "::error::SSH key is invalid or empty. Check SSH_PRIVATE_KEY secret."
            exit 1
          fi

          ssh_opts=(-i "$KEY_FILE" -p "$SSH_PORT" \
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=10 -o BatchMode=yes)

          echo "Testing SSH to ${SSH_USER}@${SSH_HOST}:${SSH_PORT}"
          ssh "${ssh_opts[@]}" "${SSH_USER}@${SSH_HOST}" "echo SSH_OK; whoami; ls -la ${TARGET}"
          echo "SSH connection test passed"

      - name: Deploy via git pull over SSH
        shell: bash
        run: |
          set -euo pipefail
          SSH_USER="${{ secrets.SSH_USER }}"
          SSH_HOST="${{ secrets.SSH_HOST }}"
          SSH_PORT="${{ secrets.SSH_PORT || 22 }}"
          SSH_KEY="${{ secrets.SSH_PRIVATE_KEY }}"
          TARGET="/opt/chatime"

          # Strip carriage returns (\r) yang sering ada di secret GitHub
          SSH_KEY="${SSH_KEY//$'\r'/}"

          KEY_FILE="/tmp/chatime-deploy-key"
          printf '%s\n' "$SSH_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"

          # Validasi format private key sebelum dipakai
          if ! ssh-keygen -y -f "$KEY_FILE" >/dev/null 2>&1; then
            echo "::error::SSH private key is invalid. Check SSH_PRIVATE_KEY secret."
            exit 1
          fi
          
          ssh_opts=(-i "$KEY_FILE" -p "$SSH_PORT" \
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=10 -o BatchMode=yes)

          export CHATIME_IMAGE="ghcr.io/geek-product/chatime:main-${{ github.sha }}"

          echo "Pulling latest code into ${SSH_USER}@${SSH_HOST}:${TARGET} via git pull"
          ssh "${ssh_opts[@]}" "${SSH_USER}@${SSH_HOST}" '
            set -euo pipefail
            cd /opt/chatime

            if [ ! -d /opt/chatime/.git ]; then
              echo "Remote /opt/chatime is not a git repo - initializing..."
              rm -rf /opt/chatime.new
              git clone --branch main https://github.com/geek-product/chatime.git /opt/chatime.new
              mv /opt/chatime.new/* /opt/chatime/
              rmdir /opt/chatime.new
            else
              # Kalau SUDAH ada git repo → hanya ambil commit terbaru
              git pull --ff-only origin main
            fi

            # Inject rendered env (secrets are NOT committed to the repo)
            cp .env.rendered .env
            chmod 600 .env

            chmod +x deploy/deploy.sh

            docker pull "$CHATIME_IMAGE"
            docker compose up -d --no-build --remove-orphans

            for i in $(seq 1 40); do
              if [ "$(docker inspect --format "{{.State.Health.Status}}" chatime-app 2>/dev/null)" = "healthy" ]; then
                echo "chatime-app healthy with $CHATIME_IMAGE"
                docker image prune -f >/dev/null 2>&1 || true
                exit 0
              fi
              sleep 3
            done
            echo "chatime-app did not become healthy" >&2
            docker compose logs --tail 50 app >&2 || true
            exit 1
          '
