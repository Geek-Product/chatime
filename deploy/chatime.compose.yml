# Compose file used on the deployment target (copied by CI to /opt/chatime).
# All app configuration is injected as environment variables by deploy.sh;
# the values come from Infisical for the environment being deployed.
# ${CHATIME_IMAGE} is substituted by deploy.sh (registry image + tag).
services:
  app:
    image: ${CHATIME_IMAGE}
    container_name: chatime-app
    restart: unless-stopped
    ports:
      - "${CHATIME_PORT:-4000}:4000"
    environment:
      PORT: 4000
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-30}
      UPLOAD_DIR: /app/server/uploads
      UPLOAD_MAX_MB: ${UPLOAD_MAX_MB:-25}
      APP_URL: ${APP_URL}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@example.com}
    volumes:
      - chatime-uploads:/app/server/uploads
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:4000/api/health"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5

volumes:
  chatime-uploads: